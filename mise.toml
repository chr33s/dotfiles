min_version = "2026.8.0"

[bootstrap.plugins]
vscode = "https://github.com/mise-plugins/mise-vscode-extensions"

# The only place Homebrew gets installed. Runs as step 1.7, immediately before
# the packages stage, where every brew:/brew-cask:/mas: entry would otherwise
# fail. setup.sh deliberately does not duplicate this: it installs mise from
# https://mise.run, which needs no Homebrew, so `mise bootstrap` works on its own
# (after `mise trust`) and the wrapper stays a thin convenience.
#
# Consequently mise must NOT be declared in [bootstrap.packages] — a brew:mise
# entry would install a second copy that shadows the mise.run one, since
# exports.zsh puts /opt/homebrew/bin ahead of ~/.local/bin.
[bootstrap.hooks.pre-packages]
run = """
if [ ! -x /opt/homebrew/bin/brew ] && ! command -v brew >/dev/null 2>&1; then
  /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
fi
"""

[bootstrap.hooks.post-dotfiles]
run = "mise install"

[bootstrap.packages]
# macOS ships bash 3.2.57 (frozen at the last GPLv2 release, 2007). The bin/
# scripts declare `#!/usr/bin/env bash`, and exports.zsh puts /opt/homebrew/bin
# ahead of /bin, so this is what they resolve to.
