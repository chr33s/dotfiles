"~/.config/mise" = "config/mise"
"~/.curlrc" = "config/curl/curlrc"
"~/.editorconfig" = "config/editorconfig/editorconfig"
"~/.gemrc" = "config/gem/gemrc"
"~/.gitconfig" = "config/git/gitconfig"
"~/.gitignore" = "config/git/gitignore"
"~/.npmrc" = "config/npm/npmrc"
"~/.screenrc" = "config/screen/screenrc"
"~/.tmux.conf" = "config/tmux/tmux.conf"
"~/.vimrc" = "config/vim/vimrc"
"~/.zsh" = "config/zsh"
"~/.zshrc" = "config/zsh/zshrc"
"~/Library/Application Support/Code/User/settings.json" = "config/vscode/settings.json"
"~/.config/zed/settings.json" = "config/zed/settings.json"
"~/.config/herdr/config.toml" = "config/herdr/config.toml"

# Map individual files here, not the containing directory. `mise bootstrap
# dotfiles apply --force` replaces an existing target directory with a symlink
# and does not back it up, so mapping ~/.ssh or ~/.gnupg would destroy the
# private keys and keyring that live alongside these files — the repo only
# tracks the .conf/config members (see .gitignore), never the secrets.
#
# ~/.config/mise and ~/.zsh above stay directory mappings on purpose: the repo
# tracks their full contents, so nothing untracked can be lost, and mise needs
# ~/.config/mise to be a real directory to write mise.lock back into the repo.
"~/.gnupg/common.conf" = "config/gnupg/common.conf"
"~/.gnupg/gpg-agent.conf" = "config/gnupg/gpg-agent.conf"
"~/.ssh/config" = "config/ssh/config"
"~/.ssh/allowed_signers" = "config/ssh/allowed_signers"
"~/.vim/plugins.vim" = "config/vim/plugins.vim"

"~/.local/bin/_audit" = "bin/audit"
"~/.local/bin/_bundle" = "bin/bundle"
"~/.local/bin/_data" = "bin/data"
"~/.local/bin/_disk" = "bin/disk"
"~/.local/bin/_dotenv" = "bin/dotenv"
"~/.local/bin/_file" = "bin/file"
"~/.local/bin/_git" = "bin/git"
"~/.local/bin/_json" = "bin/json"
"~/.local/bin/_keychain" = "bin/keychain"
"~/.local/bin/_manp" = "bin/manp"
"~/.local/bin/_open" = "bin/open"
"~/.local/bin/_os" = "bin/os"
"~/.local/bin/_password" = "bin/password"
"~/.local/bin/_pip" = "bin/pip"
"~/.local/bin/_random" = "bin/random"
"~/.local/bin/_rm" = "bin/rm"
"~/.local/bin/_server" = "bin/server"
