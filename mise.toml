[tasks.bootstrap-status]
description = "Report bootstrap drift without changing the machine"
run = "mise bootstrap status --missing"

# Runs as bootstrap step 15. These are the steps `setup.sh` used to do before it
# was reduced to a mise wrapper, plus the theme installs that the ghostty, zed
# and vscode configs all depend on.
[tasks.bootstrap]
description = "Post-package setup: App Store auth, themes, terminal defaults"
run = """
if command -v mas >/dev/null 2>&1 && ! mas account >/dev/null 2>&1; then
  echo "Sign in to the App Store before the mas: packages can install." >&2
fi

npm --prefix themes/blackboard run install

defaults write com.apple.terminal StringEncodings -array 4
defaults write com.apple.screencapture location -string "${HOME}/Downloads"
"""
